name: mouse-lottery

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: mouse-lottery-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MONGODB_URI: mongodb://mongo-shared:27017/mouse_lottery
      PORT: 4001
    networks:
      - vm_shared

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: mouse-lottery-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - vm_shared

  nginx:
    image: nginx:1.27-alpine
    container_name: mouse-lottery-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vm_shared

networks:
  vm_shared:
    name: vm-shared
    external: true